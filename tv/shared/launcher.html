<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canali Sport</title>
<style>
  /* Schermata iniziale dell'app TV: indirizzo del server, da compilare una volta col telecomando */
  :root { --bg: #0b1018; --panel: #141c28; --ink: #e8edf4; --muted: #92a0b3; --line: #253144; --accent: #ff6a3d; --bad: #f0a640; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", Roboto, system-ui, sans-serif; font-size: 26px;
         display: grid; place-items: center; padding: 48px; }
  main { width: min(1100px, 100%); display: grid; gap: 28px; }
  h1 { font-size: 64px; letter-spacing: .03em; text-transform: uppercase; margin: 0; font-weight: 900; }
  p { margin: 0; color: var(--muted); line-height: 1.4; }
  label { display: grid; gap: 10px; font-size: 22px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input { font: inherit; font-size: 34px; padding: 18px 22px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); width: 100%; }
  input:focus, button:focus { outline: 5px solid var(--accent); outline-offset: 4px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: .05em; padding: 18px 34px; border-radius: 12px; border: 0;
           background: var(--accent); color: #1a0b05; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .err { color: var(--bad); min-height: 1.4em; }
  .examples { font-size: 22px; }
  code { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Canali Sport</h1>
  <p>Scrivi l'indirizzo del tuo server, lo stesso che apri dal telefono. Lo chiedo solo la prima volta.</p>
  <label for="url">Indirizzo del server
    <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.20:8080">
  </label>
  <p class="examples">Esempi: <code>http://192.168.1.20:8080</code> (Mac in casa) · <code>https://leonesport.duckdns.org</code> (server online)</p>
  <div class="row">
    <button id="go" type="button">Collega</button>
    <button id="reset" class="ghost" type="button">Cancella</button>
  </div>
  <p class="err" id="err"></p>
</main>
<script>
(function () {
  var KEY = "cs-server";
  var $ = function (id) { return document.getElementById(id); };
  var q = location.search;
  function load() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
  function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function normalize(v) {
    v = (v || "").trim().replace(/\/+$/, "");
    if (!v) return "";
    if (!/^https?:\/\//i.test(v)) v = (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(v) || /:\d+$/.test(v) ? "http://" : "https://") + v;
    return v;
  }
  function go(v) { location.href = v + "/?tv=1"; }
  // Installata dal server: la TV ci passa già l'indirizzo del server nei parametri di avvio.
  try {
    var lp = window.PalmSystem && PalmSystem.launchParams ? JSON.parse(PalmSystem.launchParams) : {};
    if (lp && lp.server) save(normalize(lp.server));
  } catch (e) {}
  var saved = load();
  var m = q.match(/[?&]err=([^&]*)/);
  if (m) $("err").textContent = "Non riesco ad aprire " + (saved || "il server") + ": " + decodeURIComponent(m[1]) + ". Controlla l'indirizzo e che il server sia acceso.";
  $("url").value = saved;
  if (saved && !/[?&](setup|err)=/.test(q)) { go(saved); return; }
  $("go").addEventListener("click", function () {
    var v = normalize($("url").value);
    if (!v) { $("err").textContent = "Scrivi l'indirizzo del server."; return; }
    save(v); go(v);
  });
  $("reset").addEventListener("click", function () { save(""); $("url").value = ""; $("url").focus(); });
  $("url").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); $("go").focus(); }
  });
  document.addEventListener("keydown", function (e) {
    var a = document.activeElement;
    if (e.keyCode === 461 || e.key === "GoBack") { if (window.webOS && webOS.platformBack) webOS.platformBack(); return; }
    if (e.key === "ArrowDown" && a === $("url")) { e.preventDefault(); $("go").focus(); }
    else if (e.key === "ArrowUp" && a && a.tagName === "BUTTON") { e.preventDefault(); $("url").focus(); }
    else if (e.key === "ArrowRight" && a === $("go")) { e.preventDefault(); $("reset").focus(); }
    else if (e.key === "ArrowLeft" && a === $("reset")) { e.preventDefault(); $("go").focus(); }
  });
  (saved ? $("go") : $("url")).focus();
})();
</script>
</body>
</html>
