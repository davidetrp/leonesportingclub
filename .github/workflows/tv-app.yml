name: App TV (Fire TV + LG webOS)

on:
  push:
    branches: [main]
    paths: ["tv/**", ".github/workflows/tv-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK per Fire TV
        working-directory: tv/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          cp ../shared/launcher.html app/src/main/assets/launcher.html
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../../canali-sport-firetv.apk

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: IPK per LG webOS
        run: |
          cp tv/shared/launcher.html tv/webos/index.html
          npx -y -p @webos-tools/cli ares-package tv/webos -o out-webos
          cp out-webos/*.ipk canali-sport-webos.ipk

      - name: Pubblica (release «tv-app»)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app
          name: App TV
          make_latest: true
          body: |
            App di Canali Sport per TV, aggiornata in automatico a ogni modifica.
            - Fire TV: canali-sport-firetv.apk (installazione con Downloader, vedi README)
            - LG webOS: canali-sport-webos.ipk (installazione con la modalità sviluppatore, vedi README)
          files: |
            canali-sport-firetv.apk
            canali-sport-webos.ipk
